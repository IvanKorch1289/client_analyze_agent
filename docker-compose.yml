services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: counterparty-analyzer
    ports:
      - "5000:5000"
      - "8000:8000"
    environment:
      - BACKEND_PORT=8000
      - STREAMLIT_SERVER_PORT=5000
      - TARANTOOL_HOST=tarantool
      - TARANTOOL_PORT=3302
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      # По умолчанию задачи выполняются in-process.
      # Чтобы включить очередь: RABBITMQ_ENABLED=true
    env_file:
      - .env
    depends_on:
      tarantool:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/utility/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: counterparty-worker
    command: ["python", "-m", "app.messaging.worker"]
    environment:
      - TARANTOOL_HOST=tarantool
      - TARANTOOL_PORT=3302
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_ENABLED=true
    env_file:
      - .env
    depends_on:
      tarantool:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: counterparty-mcp
    command: ["python", "-m", "app.mcp_server.main"]
    ports:
      - "8011:8011"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8011
      - MCP_PATH=/mcp
      - TARANTOOL_HOST=tarantool
      - TARANTOOL_PORT=3302
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    env_file:
      - .env
    depends_on:
      tarantool:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs

  tarantool:
    image: tarantool/tarantool:2.11
    container_name: tarantool-cache
    ports:
      - "3302:3302"
    environment:
      - TARANTOOL_INIT_SCRIPT=/opt/tarantool/init.lua
    volumes:
      - ./app/storage/init.lua:/opt/tarantool/init.lua:ro
      - tarantool_data:/var/lib/tarantool
    command: ["tarantool", "/opt/tarantool/init.lua"]
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "tarantool", "-e", "require('console').connect('localhost:3302')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Jay Guard - PII Protection Proxy
  jayguard:
    build:
      context: ./infra/jayguard
      dockerfile: Dockerfile
    container_name: jayguard-proxy
    ports:
      - "8090:8090"
    environment:
      - JAYGUARD_PORT=8090
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PRESIDIO_ENABLED=true
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tarantool_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
