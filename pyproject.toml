[tool.poetry]
name = "analyze-agent"
version = "0.1.0"
description = ""
authors = ["crazyivan1289 <crazyivan1289@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.125.0"
slowapi = "^0.1.9"
langchain = "^1.2.3"  # CVE-2025-68664 fix - upgraded to 1.x
langgraph = "^1.0.6"
langchain-openai = "^1.1.7"
langchain-community = "^0.4.1"
langchain-huggingface = "^1.2.0"
gigachat = "^0.1.43"
fastmcp = "^2.14.1"
tarantool = "^1.2.0"
httpx = {extras = ["http2"], version = "^0.28.1"}
tenacity = "^9.1.2"
python-dotenv = "^1.1.1"
hvac = "^2.1.0"
pyyaml = "^6.0.1"
xmltodict = "^0.15.0"
aiofiles = "^24.1.0"
streamlit = "1.45.0"
pydantic-settings = "^2.12.0"
uvicorn = "^0.38.0"
fpdf2 = "^2.8.1"
rich = "^14.0.0"
apscheduler = "^3.10.4"
msgpack = "^1.1.0"
opentelemetry-api = "^1.39.1"
opentelemetry-sdk = "^1.39.1"
opentelemetry-instrumentation-fastapi = "^0.60b1"
tavily-python = "^0.7.17"
openai = "^2.13.0"
faststream = {extras = ["rabbit"], version = "^0.6.4"}
starlette = "^0.50.0"
jinja2 = "^3.1.6"
cryptography = "^46.0.3"
setuptools = "^80.9.0"
watchdog = "^6.0.0"
requests = "^2.32.5"
bs4 = "^0.0.2"
yandexcloud = "^0.372.0"
# Security fixes for transitive dependencies
aiohttp = "^3.13.3"      # CVE-2025-69223 through CVE-2025-69230
urllib3 = "^2.6.3"       # CVE-2026-21441

# Sprint 0: Security & Optimization
presidio-analyzer = "^2.2.355"        # PII detection (Microsoft)
presidio-anonymizer = "^2.2.355"      # PII anonymization
loguru = "^0.7.3"                     # Better logging
prometheus-client = "^0.22.1"         # Prometheus metrics
prometheus-fastapi-instrumentator = "^7.0.0"  # FastAPI metrics
asyncer = "^0.0.8"                    # Async utilities
pympler = "^1.1"                      # Memory profiling
psutil = "^6.1.1"                     # System metrics (CPU, memory)

# Sprint 6: UI/UX Improvements
plotly = "^6.1.0"                     # Risk score visualization

# RAG (Retrieval Augmented Generation)
chromadb = "^0.6.3"                   # Vector database
sentence-transformers = "^3.4.1"      # Embeddings (multilingual-e5-base)
pypdf2 = "^3.0.1"                    # PDF text extraction
python-docx = "^1.1.2"               # DOCX text extraction
python-multipart = "^0.0.20"         # File upload support

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.11"
pyright = "^1.1.404"
detect-secrets = "^1.5.0"
pylint = "^3.3.8"
pip-audit = "^2.10.0"
bandit = "^1.8.6"
deptry = "^0.23.1"
black = "^25.1.0"
vulture = "^2.14"
pytest = "^8.4.1"
pytest-asyncio = "^1.3.0"
mypy = "^1.12.0"
types-requests = "^2.26.0"
complexipy = "^0.4.0"               # Code complexity analysis
safety = "^3.3.2"                   # Dependency security scanner
locust = "^2.43.1"
pytest-benchmark = "^5.2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.vulture]
ignore_names = [
    "x_api_key"
]
min_confidence = 70
exclude = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*"
]

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",   # pycodestyle
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
]
ignore = ["E501"]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.format]
line-ending = "auto"
indent-style = "space"
quote-style = "double"
