# Конфигурация приложения для Production окружения
# Загружается через APP_CONFIG_PATH=config/app.prod.yaml

app:
  app_name: "counterparty-analyzer"
  environment: "production"
  backend_port: 8000
  streamlit_port: 5000
  debug: false
  reload: false
  log_level: "INFO"
  log_format: "json"
  workers: 4
  max_requests: 2000
  analysis_timeout_seconds: 600
  cb_failure_threshold: 30
  cb_window_seconds: 60
  cb_open_seconds: 30
  otel_service_name: "counterparty-analysis"

security:
  cors_enabled: true
  # Override via SECURITY_CORS_ORIGINS env var before deploy
  cors_origins:
    - "https://app.example.com"
  cors_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  cors_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Request-ID"
    - "X-Auth-Token"
  cors_credentials: true
  rate_limit_enabled: true
  rate_limit_storage: "memory://"
  enable_security_headers: true
  hsts_enabled: true
  encryption_enabled: true
  trusted_hosts:
    - "app.example.com"
    - "localhost"

scheduler:
  enabled: true
  cleanup_interval: 3600
  healthcheck_interval: 300
  cache_cleanup_interval: 1800
  old_reports_ttl_days: 90
  old_logs_ttl_days: 30

tarantool:
  host: "tarantool"
  port: 3302
  user: "admin"
  connect_timeout: 5.0
  reconnect_max_attempts: 5
  reconnect_delay: 2.0
  pool_size: 20
  use_memory_fallback: false
  cache_space: "cache"
  reports_space: "reports"
  threads_space: "threads"
  persistent_space: "persistent"

queue:
  host: "rabbitmq"
  port: 5672
  vhost: "/"
  management_port: 15672
  analysis_queue: "analysis.client"
  reports_queue: "reports.generate"
  notifications_queue: "notifications.email"
  cache_queue: "cache.invalidate"
  prefetch_count: 10
  max_retries: 3
  retry_delay: 5
  dlq_enabled: true
  dlq_ttl: 86400

http_base:
  connect_timeout: 5.0
  read_timeout: 30.0
  write_timeout: 10.0
  pool_timeout: 5.0
  max_retries: 3
  retry_backoff_factor: 0.5
  max_connections: 100
  max_keepalive_connections: 40
  http2_enabled: true
  trace_max_body_bytes: 4096

mcp:
  host: "0.0.0.0"
  port: 8011
  path: "/mcp"
  files_root: "/app/reports"
  max_file_bytes: 1048576

frontend:
  base_url: "http://app:8000/api/v1"
  timeout_seconds: 120

redis:
  host: "redis"
  port: 6379
  db: 0
  max_connections: 50
  socket_timeout: 5.0
  default_ttl: 3600
  encoding: "utf-8"
  decode_responses: true

dadata:
  api_url: "https://suggestions.dadata.ru/suggestions/api/4_1/rs/findById/party"
  timeout: 30.0
  cache_ttl: 7200
  rate_limit_per_second: 10

casebook:
  arbitr_url: "https://api3.casebook.ru/arbitrage/cases"
  timeout: 30.0
  cache_ttl: 9600
  page_size: 100

infosphere:
  api_url: "https://i-sphere.ru/2.00/"
  timeout: 45.0
  cache_ttl: 3600
  sources: "fssp,bankrot,cbr,egrul,fns,fsin,fmsdb,fms,gosuslugi,mvd,pfr,terrorist"

perplexity:
  api_url: "https://api.perplexity.ai"
  model: "sonar-pro"
  temperature: 0.2
  search_recency_filter: "month"
  timeout: 60.0
  cache_ttl: 300
  cache_enabled: true

tavily:
  search_depth: "advanced"
  max_results: 10
  include_answer: true
  include_raw_content: false
  timeout: 60.0
  cache_ttl: 300
  cache_enabled: true

openrouter:
  api_url: "https://openrouter.ai/api/v1"
  model: "anthropic/claude-3.5-sonnet"
  temperature: 0.1
  max_tokens: 1000
  top_p: 1.0
  timeout: 60.0
  http_referer: "https://app.example.com"
  http_title: "Client Analysis System"

huggingface:
  model: "meta-llama/Meta-Llama-3.1-70B-Instruct"
  temperature: 0.2
  max_tokens: 4096
  top_p: 0.95
  timeout: 120.0

gigachat:
  model: "GigaChat-Pro"
  temperature: 0.2
  max_tokens: 4096
  top_p: 0.95
  timeout: 120.0
  verify_ssl_certs: true

yandexgpt:
  model_uri: "gpt://folder_id/yandexgpt-lite"
  temperature: 0.3
  max_tokens: 2000
  timeout: 60

jayguard:
  enabled: false
  timeout: 120.0

mail:
  smtp_port: 587
  smtp_use_tls: true
  smtp_use_ssl: false
  smtp_timeout: 10
  templates_dir: "templates/email"
  enable_notifications: false

tasks:
  enabled: true
  enable_cleanup: true
  enable_healthchecks: true
  enable_reports_generation: true
  cleanup_interval: 3600
  healthcheck_interval: 300

storage:
  local_storage_path: "/app/storage"
  reports_path: "/app/reports"
  logs_path: "/app/logs"
  temp_path: "/app/temp"
  s3_enabled: false
  max_file_size_mb: 10
  max_upload_size_mb: 100

grpc:
  enabled: false
  host: "0.0.0.0"
  port: 50051
  max_workers: 10
  max_message_length: 4194304
  tls_enabled: false

logging:
  level: "INFO"
  format: "json"
  file_enabled: true
  file_path: "./logs"
  file_rotation: "daily"
  file_max_size_mb: 200
  file_backup_count: 30
  structured_enabled: true
  sentry_enabled: false
  elasticsearch_enabled: false
