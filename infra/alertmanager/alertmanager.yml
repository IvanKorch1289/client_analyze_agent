# AlertManager Configuration
# Client Analysis Agent

global:
  resolve_timeout: 5m
  # Slack webhook URL (set via environment or replace placeholder)
  slack_api_url: '${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/YOUR/WEBHOOK/URL}'

# Routing tree
route:
  # Default receiver
  receiver: 'default-receiver'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'service']

  # Wait before sending first notification
  group_wait: 30s

  # Wait before sending updates
  group_interval: 5m

  # Resend interval
  repeat_interval: 4h

  # Child routes for specific severities
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Warning alerts - standard notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      repeat_interval: 4h

    # Info alerts - low priority
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 12h

# Receivers
receivers:
  - name: 'default-receiver'
    slack_configs:
      - channel: '#monitoring'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

  - name: 'critical-alerts'
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: |
          *Status:* {{ .Status | toUpper }}
          *Severity:* {{ .CommonLabels.severity }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{ end }}
    # Uncomment for PagerDuty integration
    # pagerduty_configs:
    #   - routing_key: '${PAGERDUTY_ROUTING_KEY}'
    #     severity: critical

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: |
          *Status:* {{ .Status | toUpper }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{ end }}

  - name: 'info-alerts'
    slack_configs:
      - channel: '#alerts-info'
        send_resolved: false
        title: '[INFO] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'

# Inhibition rules - suppress lower severity alerts when higher severity is firing
inhibit_rules:
  # If critical alert is firing, suppress warning alerts for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # If warning alert is firing, suppress info alerts for same alertname
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'instance']

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'
