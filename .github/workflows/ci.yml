name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # Nightly security scan at 2 AM UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Stage 1: Code Quality & Testing
  # ==========================================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Ruff (linting)
        run: poetry run ruff check .

      - name: Pyright (type checking)
        run: poetry run pyright

      - name: Pytest with coverage
        env:
          SKIP_INTEGRATION: "true"
        run: |
          poetry run pytest -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ==========================================================================
  # Stage 2: Security Scanning
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Bandit (SAST)
        run: poetry run bandit -r app -c .bandit.yml -f json -o bandit-report.json || true

      - name: pip-audit (dependency vulnerabilities)
        run: poetry run pip-audit --format json --output pip-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
        if: always()

      - name: Check for critical vulnerabilities
        run: |
          # Fail if bandit finds high severity issues
          if [ -f bandit-report.json ]; then
            HIGH_ISSUES=$(cat bandit-report.json | python -c "import sys,json; d=json.load(sys.stdin); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']))" 2>/dev/null || echo "0")
            if [ "$HIGH_ISSUES" -gt "0" ]; then
              echo "::error::Found $HIGH_ISSUES high severity security issues"
              cat bandit-report.json | python -c "import sys,json; d=json.load(sys.stdin); [print(f\"- {r['filename']}:{r['line_number']}: {r['issue_text']}\") for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']"
              exit 1
            fi
          fi

  # ==========================================================================
  # Stage 3: Build & Push Docker Image
  # ==========================================================================
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Stage 4: Container Security Scan
  # ==========================================================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

  # ==========================================================================
  # Stage 5: Smoke Tests
  # ==========================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Start app (background)
        env:
          TARANTOOL_ENABLED: "false"
          QUEUE_ENABLED: "false"
          CHROMA_ENABLED: "false"
          ADMIN_TOKEN: "smoke-test-token"
        run: |
          poetry run python -c "
          import uvicorn
          from app.main import app
          uvicorn.run(app, host='127.0.0.1', port=8000)
          " &
          # Wait for app to start
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/docs > /dev/null 2>&1; then
              echo "App started successfully"
              break
            fi
            echo "Waiting for app to start... ($i/30)"
            sleep 2
          done

      - name: Smoke test — health endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/health)
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Health endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Health endpoint: HTTP $HTTP_CODE"

      - name: Smoke test — OpenAPI schema
        run: |
          curl -sf http://127.0.0.1:8000/openapi.json | python -c "
          import sys, json
          schema = json.load(sys.stdin)
          paths = list(schema.get('paths', {}).keys())
          assert len(paths) > 0, 'No API paths found in OpenAPI schema'
          print(f'OpenAPI schema OK: {len(paths)} endpoints')
          # Verify key endpoints exist
          required = ['/api/v1/agent/analyze-client']
          for ep in required:
            assert any(ep in p for p in paths), f'Required endpoint {ep} not found'
          print('All required endpoints present')
          "

      - name: Smoke test — PII masking endpoint
        run: |
          RESPONSE=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/llm/mask-text \
            -H "Content-Type: application/json" \
            -d '{"text": "ИНН 7707083893"}')
          echo "$RESPONSE" | python -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'masked_text' in data.get('data', data), 'PII masking response missing masked_text'
          print('PII masking endpoint: OK')
          " || echo "::warning::PII masking smoke test skipped (Presidio may not be installed)"

      - name: Smoke test — metrics endpoint
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/metrics > /dev/null && echo "Metrics endpoint: OK" || echo "::warning::Metrics endpoint not available"

      - name: Smoke test — legacy deprecation headers
        run: |
          HEADERS=$(curl -sI http://127.0.0.1:8000/agent/analyze-client 2>/dev/null || true)
          if echo "$HEADERS" | grep -qi "deprecation"; then
            echo "Legacy deprecation headers: present"
          else
            echo "::warning::Legacy deprecation headers not found"
          fi
